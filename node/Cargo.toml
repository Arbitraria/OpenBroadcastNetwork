[package]
name = "OpenBroadcastNetwork-node"
version = "0.1.0"
edition = "2021"
description = "Relay node for the decentralized streaming CDN"
authors = ["Decentralized Stream Developers"]

[dependencies]
OpenBroadcastNetwork-core = { path = "../core" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = "1.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
libp2p = { workspace = true }
clap = { version = "4.3", features = ["derive"] }
term-table = { version = "1.3", optional = true }
term_size = "0.3"
chrono = "0.4"
rand = "0.8"
colored = { version = "2.0", optional = true }
geo-ip = "0.1.0"

[features]
default = ["visualization"]
visualization = ["colored", "term-table"]
metrics = []

[[bin]]
name = "relay-node"
path = "src/main.rs"
