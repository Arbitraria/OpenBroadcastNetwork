<!DOCTYPE html>
<html>
<head>
    <title>Firefox MediaSource Debug</title>
</head>
<body>
    <h1>Firefox MediaSource Debug Tool</h1>
    <video id="video" controls width="640" height="480" style="border: 2px solid red;"></video>
    <div id="log" style="font-family: monospace; white-space: pre-wrap; border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: auto;"></div>

    <script>
        const video = document.getElementById('video');
        const log = document.getElementById('log');
        let mediaSource = null;
        let sourceBuffer = null;
        let ws = null;
        let initSegmentReceived = false;

        function addLog(message, isError = false) {
            const time = new Date().toLocaleTimeString();
            const style = isError ? 'color: red;' : '';
            console.log(message);
            log.innerHTML += `<div style="${style}">${time}: ${message}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        addLog('🦊 Firefox MediaSource Debug Started');
        
        // Test MediaSource support
        if (!window.MediaSource) {
            addLog('❌ MediaSource API not supported!', true);
            return;
        }
        addLog('✅ MediaSource API available');

        // Test codec support with multiple formats
        const codecTests = [
            'video/mp4; codecs="avc1.42E01E"',
            'video/mp4; codecs="avc1.42001e"',  
            'video/mp4; codecs="avc1.4d401e"',
            'audio/mp4; codecs="mp4a.40.2"',
            'audio/mp4; codecs="mp4a.40.02"',
            'audio/mp4; codecs="mp4a.40.5"',
            'video/mp4; codecs="avc1.42E01E, mp4a.40.2"'
        ];

        addLog('\n📋 Testing codec support:');
        codecTests.forEach(codec => {
            const supported = MediaSource.isTypeSupported(codec);
            addLog(`${codec}: ${supported ? '✅ Supported' : '❌ Not supported'}`, !supported);
        });

        // Set up MediaSource
        try {
            mediaSource = new MediaSource();
            video.src = URL.createObjectURL(mediaSource);
            addLog('\n✅ Created MediaSource and attached to video');
        } catch (e) {
            addLog(`❌ Failed to create MediaSource: ${e.message}`, true);
            return;
        }

        // MediaSource event handlers
        mediaSource.addEventListener('sourceopen', () => {
            addLog('📂 MediaSource opened');
            
            // Try to add source buffer
            try {
                const mimeType = 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"';
                sourceBuffer = mediaSource.addSourceBuffer(mimeType);
                addLog(`✅ Created SourceBuffer with: ${mimeType}`);
                
                // SourceBuffer event handlers
                sourceBuffer.addEventListener('updateend', () => {
                    addLog('📦 SourceBuffer update completed');
                    
                    if (!initSegmentReceived && sourceBuffer.buffered.length > 0) {
                        initSegmentReceived = true;
                        const start = sourceBuffer.buffered.start(0);
                        const end = sourceBuffer.buffered.end(0);
                        addLog(`✅ Initialization segment processed. Buffered: ${start} - ${end} seconds`);
                    }
                });
                
                sourceBuffer.addEventListener('error', (e) => {
                    addLog(`❌ SourceBuffer error: ${e}`, true);
                });
                
                sourceBuffer.addEventListener('abort', () => {
                    addLog('⚠️ SourceBuffer aborted');
                });
                
            } catch (e) {
                addLog(`❌ Failed to add SourceBuffer: ${e.message}`, true);
                return;
            }
            
            // Start WebSocket connection
            connectWebSocket();
        });

        mediaSource.addEventListener('sourceended', () => {
            addLog('📕 MediaSource ended');
        });

        mediaSource.addEventListener('sourceclose', () => {
            addLog('📕 MediaSource closed');
        });

        // Video element event handlers
        video.addEventListener('error', (e) => {
            const error = video.error;
            if (error) {
                addLog(`❌ Video error: ${error.code} - ${error.message}`, true);
                switch(error.code) {
                    case 1: addLog('MEDIA_ERR_ABORTED', true); break;
                    case 2: addLog('MEDIA_ERR_NETWORK', true); break;
                    case 3: addLog('MEDIA_ERR_DECODE', true); break;
                    case 4: addLog('MEDIA_ERR_SRC_NOT_SUPPORTED', true); break;
                }
            }
        });

        video.addEventListener('loadedmetadata', () => {
            addLog(`📹 Video metadata loaded: ${video.videoWidth}x${video.videoHeight}, duration: ${video.duration}`);
        });

        video.addEventListener('canplay', () => {
            addLog('▶️ Video can start playing');
        });

        video.addEventListener('playing', () => {
            addLog('🎬 Video is playing');
        });

        video.addEventListener('waiting', () => {
            addLog('⏳ Video is waiting for data');
        });

        video.addEventListener('stalled', () => {
            addLog('⚠️ Video stalled');
        });

        function connectWebSocket() {
            addLog('\n🔌 Connecting to WebSocket...');
            ws = new WebSocket('ws://127.0.0.1:8080/stream');
            let messageCount = 0;
            let totalBytes = 0;
            
            ws.binaryType = 'arraybuffer';
            
            ws.onopen = () => {
                addLog('✅ WebSocket connected');
            };
            
            ws.onmessage = (event) => {
                messageCount++;
                
                if (typeof event.data === 'string') {
                    try {
                        const msg = JSON.parse(event.data);
                        addLog(`📨 Message #${messageCount}: ${msg.type}`);
                        
                        if (msg.type === 'stream_info') {
                            addLog(`  Video: ${msg.data.video.width}x${msg.data.video.height} @ ${msg.data.video.fps}fps`);
                            addLog(`  Video codec: ${msg.data.video.mime_type}`);
                            addLog(`  Audio: ${msg.data.audio.sample_rate}Hz, ${msg.data.audio.channels}ch`);
                            addLog(`  Audio codec: ${msg.data.audio.mime_type}`);
                        }
                    } catch (e) {
                        addLog(`📨 Message #${messageCount}: ${event.data}`);
                    }
                } else {
                    const size = event.data.byteLength;
                    totalBytes += size;
                    addLog(`📦 Message #${messageCount}: Binary data (${(size/1024).toFixed(1)} KB, total: ${(totalBytes/1024/1024).toFixed(1)} MB)`);
                    
                    // Try to append to SourceBuffer
                    if (sourceBuffer && !sourceBuffer.updating && mediaSource.readyState === 'open') {
                        try {
                            sourceBuffer.appendBuffer(event.data);
                            addLog(`  ✅ Appended to SourceBuffer`);
                        } catch (e) {
                            addLog(`  ❌ Failed to append: ${e.message}`, true);
                            
                            // Log buffer state
                            if (sourceBuffer.buffered.length > 0) {
                                for (let i = 0; i < sourceBuffer.buffered.length; i++) {
                                    addLog(`  Buffer range ${i}: ${sourceBuffer.buffered.start(i)} - ${sourceBuffer.buffered.end(i)}`);
                                }
                            }
                        }
                    } else {
                        if (sourceBuffer?.updating) {
                            addLog(`  ⏳ SourceBuffer is updating, skipping`);
                        } else if (mediaSource.readyState !== 'open') {
                            addLog(`  ⚠️ MediaSource state: ${mediaSource.readyState}`);
                        }
                    }
                }
            };
            
            ws.onerror = (error) => {
                addLog(`❌ WebSocket error: ${error}`, true);
            };
            
            ws.onclose = (event) => {
                addLog(`🔌 WebSocket closed: code=${event.code}, reason=${event.reason}`);
                if (event.code === 1009) {
                    addLog('❌ Message too big! Server rejected large frame', true);
                }
            };
        }

        // Add manual play button for Firefox autoplay issues
        const playBtn = document.createElement('button');
        playBtn.textContent = 'Manual Play';
        playBtn.onclick = () => {
            video.play().then(() => {
                addLog('✅ Manual play started');
            }).catch(e => {
                addLog(`❌ Manual play failed: ${e.message}`, true);
            });
        };
        document.body.insertBefore(playBtn, video);
    </script>
</body>
</html>
