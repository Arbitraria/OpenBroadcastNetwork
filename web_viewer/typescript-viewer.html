<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBroadcastNetwork - TypeScript Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #A8E6CF;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn.primary {
            background: rgba(168, 230, 207, 0.2);
            border-color: #A8E6CF;
            color: #A8E6CF;
        }

        .btn.primary:hover {
            background: rgba(168, 230, 207, 0.3);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            transition: background-color 0.3s ease;
        }

        .status-indicator.connected {
            background: #44ff44;
        }

        .status-indicator.connecting {
            background: #ffaa00;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #video-container {
            flex: 1;
            position: relative;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #A8E6CF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            display: none;
        }

        .error-overlay.visible {
            display: flex;
        }

        .error-content {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
        }

        .error-icon {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 15px;
        }

        .error-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ff4444;
        }

        .error-message {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .footer {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .header {
                padding: 8px 15px;
            }
            
            .header h1 {
                font-size: 16px;
            }
            
            .btn {
                padding: 4px 8px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <header class="header">
            <h1>OpenBroadcastNetwork TypeScript</h1>
            <div class="header-controls">
                <div class="connection-status">
                    <span class="status-indicator" id="connection-indicator"></span>
                    <span id="connection-text">Disconnected</span>
                </div>
                <button class="btn" id="debug-toggle">Debug</button>
                <button class="btn primary" id="connect-btn">Connect</button>
            </div>
        </header>

        <div id="video-container">
            <!-- Video player will be created here by TypeScript -->
            
            <div class="loading-overlay" id="loading-overlay">
                <div class="spinner"></div>
                <div class="loading-text">
                    <div id="loading-message">Initializing video player...</div>
                </div>
            </div>

            <div class="error-overlay" id="error-overlay">
                <div class="error-content">
                    <div class="error-icon">⚠️</div>
                    <div class="error-title">Connection Error</div>
                    <div class="error-message" id="error-message">
                        Unable to connect to the streaming server.
                    </div>
                    <button class="btn primary" id="retry-btn">Retry Connection</button>
                </div>
            </div>
        </div>

        <footer class="footer">
            <span>OpenBroadcastNetwork TypeScript Viewer v1.0</span>
            <span style="margin: 0 10px;">•</span>
            <span>WebSocket: <span id="websocket-url">ws://localhost:8080/stream</span></span>
            <span style="margin: 0 10px;">•</span>
            <span>Built with TypeScript & MSE</span>
        </footer>
    </div>

    <!-- Load the TypeScript application -->
    <script src="main.9b279abcfdfc45f739ac.js"></script>
    
    <script>
        // Modern TypeScript Streaming Application
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Initializing OpenBroadcastNetwork TypeScript Viewer');
            
            let streamingApp = null;
            let isConnecting = false;
            
            // UI elements
            const elements = {
                connectBtn: document.getElementById('connect-btn'),
                debugToggle: document.getElementById('debug-toggle'),
                retryBtn: document.getElementById('retry-btn'),
                loadingOverlay: document.getElementById('loading-overlay'),
                errorOverlay: document.getElementById('error-overlay'),
                connectionIndicator: document.getElementById('connection-indicator'),
                connectionText: document.getElementById('connection-text'),
                loadingMessage: document.getElementById('loading-message'),
                errorMessage: document.getElementById('error-message'),
                websocketUrl: document.getElementById('websocket-url'),
                videoContainer: document.getElementById('video-container'),
            };
            
            // WebSocket URL configuration
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            const websocketUrl = `${protocol}//${host}/stream`;
            
            if (elements.websocketUrl) {
                elements.websocketUrl.textContent = websocketUrl;
            }
            
            // Connection state management
            function updateConnectionState(state, message = '') {
                if (elements.connectionIndicator && elements.connectionText) {
                    elements.connectionIndicator.className = `status-indicator ${state}`;
                    
                    switch (state) {
                        case 'connected':
                            elements.connectionText.textContent = 'Connected';
                            break;
                        case 'connecting':
                            elements.connectionText.textContent = 'Connecting...';
                            break;
                        case 'disconnected':
                        default:
                            elements.connectionText.textContent = message || 'Disconnected';
                            break;
                    }
                }
                
                if (elements.connectBtn) {
                    elements.connectBtn.textContent = state === 'connected' ? 'Disconnect' : 'Connect';
                    elements.connectBtn.disabled = state === 'connecting';
                }
            }
            
            // Loading state management
            function showLoading(message = 'Loading...') {
                if (elements.loadingMessage) {
                    elements.loadingMessage.textContent = message;
                }
                if (elements.loadingOverlay) {
                    elements.loadingOverlay.classList.remove('hidden');
                }
            }
            
            function hideLoading() {
                if (elements.loadingOverlay) {
                    elements.loadingOverlay.classList.add('hidden');
                }
            }
            
            // Error state management
            function showError(message, title = 'Connection Error') {
                if (elements.errorMessage) {
                    elements.errorMessage.textContent = message;
                }
                if (elements.errorOverlay) {
                    elements.errorOverlay.classList.add('visible');
                }
                hideLoading();
                updateConnectionState('disconnected', 'Error');
            }
            
            function hideError() {
                if (elements.errorOverlay) {
                    elements.errorOverlay.classList.remove('visible');
                }
            }
            
            // Basic MediaSource streaming implementation
            async function initializeStreaming() {
                if (isConnecting || streamingApp) return;
                
                try {
                    isConnecting = true;
                    updateConnectionState('connecting');
                    showLoading('Creating MediaSource...');
                    hideError();
                    
                    const mediaSource = new MediaSource();
                    const objectURL = URL.createObjectURL(mediaSource);
                    
                    let videoElement = elements.videoContainer.querySelector('video');
                    if (!videoElement) {
                        videoElement = document.createElement('video');
                        videoElement.controls = true;
                        videoElement.style.width = '100%';
                        videoElement.style.height = '100%';
                        videoElement.style.objectFit = 'contain';
                        elements.videoContainer.appendChild(videoElement);
                    }
                    
                    videoElement.src = objectURL;
                    
                    mediaSource.addEventListener('sourceopen', () => {
                        console.log('📺 MediaSource opened');
                        showLoading('Connecting to WebSocket...');
                        
                        const ws = new WebSocket(websocketUrl);
                        let videoBuffer = null;
                        let audioBuffer = null;
                        
                        ws.onopen = () => {
                            console.log('🔗 WebSocket connected');
                            updateConnectionState('connected');
                            hideLoading();
                            isConnecting = false;
                        };
                        
                        ws.onmessage = async (event) => {
                            try {
                                if (typeof event.data === 'string') {
                                    const message = JSON.parse(event.data);
                                    console.log('📨 Message:', message.type);
                                    
                                    if (message.type === 'stream_info') {
                                        console.log('🎬 Stream info:', message);
                                        
                                        // Create source buffers
                                        if (message.video && !videoBuffer) {
                                            let videoMimeType = `video/mp4; codecs="avc1.42C01E"`;
                                            
                                            // Handle different video codecs
                                            if (message.video.codec === 'h264') {
                                                videoMimeType = `video/mp4; codecs="avc1.42C01E"`;
                                            } else if (message.video.codec === 'ac-3') {
                                                // AC-3 video fallback to H.264
                                                videoMimeType = `video/mp4; codecs="avc1.42C01E"`;
                                                console.log('🔄 Using H.264 fallback for AC-3 stream');
                                            }
                                            
                                            if (MediaSource.isTypeSupported(videoMimeType)) {
                                                videoBuffer = mediaSource.addSourceBuffer(videoMimeType);
                                                console.log('📺 Video buffer created:', videoMimeType);
                                            } else {
                                                console.warn('⚠️ Video codec not supported:', videoMimeType);
                                            }
                                        }
                                        
                                        if (message.audio && !audioBuffer) {
                                            let audioMimeType = `audio/mp4; codecs="mp4a.40.2"`;
                                            
                                            // Handle different audio codecs
                                            if (message.audio.codec === 'aac') {
                                                audioMimeType = `audio/mp4; codecs="mp4a.40.2"`;
                                            } else if (message.audio.codec === 'ac-3') {
                                                // AC-3 not supported in most browsers, skip audio
                                                console.log('⚠️ AC-3 audio not supported, continuing with video only');
                                                audioMimeType = null;
                                            }
                                            
                                            if (audioMimeType && MediaSource.isTypeSupported(audioMimeType)) {
                                                audioBuffer = mediaSource.addSourceBuffer(audioMimeType);
                                                console.log('🔊 Audio buffer created:', audioMimeType);
                                            } else if (audioMimeType) {
                                                console.warn('⚠️ Audio codec not supported:', audioMimeType);
                                            }
                                        }
                                    } else if (message.type === 'chunk_info') {
                                        console.log('📦 Expecting chunk:', message.size, 'bytes');
                                    } else if (message.type === 'end_of_stream') {
                                        console.log('🏁 End of stream');
                                        if (mediaSource.readyState === 'open') {
                                            mediaSource.endOfStream();
                                        }
                                    }
                                } else {
                                    // Binary data - append to appropriate buffer
                                    const dataSize = event.data.byteLength;
                                    console.log('📦 Received binary data:', dataSize, 'bytes');
                                    
                                    if (videoBuffer && !videoBuffer.updating && dataSize > 0) {
                                        try {
                                            videoBuffer.appendBuffer(event.data);
                                            console.log('✅ Appended to video buffer');
                                        } catch (error) {
                                            console.error('❌ Video buffer error:', error);
                                        }
                                    } else if (!videoBuffer) {
                                        console.warn('⚠️ No video buffer available for data');
                                    }
                                }
                            } catch (error) {
                                console.error('❌ Error handling message:', error);
                            }
                        };
                        
                        ws.onerror = (error) => {
                            console.error('❌ WebSocket error:', error);
                            showError('WebSocket connection failed');
                            isConnecting = false;
                        };
                        
                        ws.onclose = (event) => {
                            console.log('🔌 WebSocket closed:', event.code, event.reason);
                            updateConnectionState('disconnected');
                            isConnecting = false;
                            if (streamingApp) {
                                streamingApp = null;
                            }
                        };
                        
                        streamingApp = { 
                            webSocket: ws, 
                            mediaSource: mediaSource,
                            cleanup: () => {
                                if (ws.readyState === WebSocket.OPEN) {
                                    ws.close();
                                }
                                if (objectURL) {
                                    URL.revokeObjectURL(objectURL);
                                }
                            }
                        };
                    });
                    
                    mediaSource.addEventListener('error', (error) => {
                        console.error('❌ MediaSource error:', error);
                        showError('MediaSource initialization failed');
                        isConnecting = false;
                    });
                    
                } catch (error) {
                    console.error('❌ Failed to initialize streaming:', error);
                    showError(`Initialization failed: ${error.message}`);
                    isConnecting = false;
                }
            }
            
            // Disconnect streaming
            function disconnectStreaming() {
                if (streamingApp) {
                    streamingApp.cleanup();
                    streamingApp = null;
                }
                updateConnectionState('disconnected');
                hideLoading();
                hideError();
            }
            
            // Event listeners
            if (elements.connectBtn) {
                elements.connectBtn.addEventListener('click', () => {
                    if (streamingApp) {
                        disconnectStreaming();
                    } else {
                        initializeStreaming();
                    }
                });
            }
            
            if (elements.retryBtn) {
                elements.retryBtn.addEventListener('click', () => {
                    hideError();
                    initializeStreaming();
                });
            }
            
            if (elements.debugToggle) {
                elements.debugToggle.addEventListener('click', () => {
                    console.log('🐛 Debug info:');
                    console.log('- Streaming App:', streamingApp);
                    console.log('- Connection State:', elements.connectionIndicator?.className);
                    console.log('- WebSocket URL:', websocketUrl);
                    console.log('- MediaSource Support:', 'MediaSource' in window);
                    console.log('- Video Element:', elements.videoContainer.querySelector('video'));
                    
                    // Show buffered ranges
                    const video = elements.videoContainer.querySelector('video');
                    if (video && video.buffered) {
                        console.log('- Buffered Ranges:');
                        for (let i = 0; i < video.buffered.length; i++) {
                            console.log(`  ${i}: ${video.buffered.start(i).toFixed(2)}s - ${video.buffered.end(i).toFixed(2)}s`);
                        }
                    }
                });
            }
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (event) => {
                if (event.code === 'Space' && event.target === document.body) {
                    event.preventDefault();
                    const video = elements.videoContainer.querySelector('video');
                    if (video) {
                        if (video.paused) {
                            video.play().catch(console.error);
                        } else {
                            video.pause();
                        }
                    }
                } else if (event.code === 'KeyC' && event.ctrlKey) {
                    event.preventDefault();
                    elements.connectBtn?.click();
                }
            });
            
            // Initialize connection state
            updateConnectionState('disconnected');
            
            console.log('✅ TypeScript Viewer initialized');
            console.log('💡 Press Ctrl+C to connect, Space to play/pause');
            console.log('🎯 WebSocket URL:', websocketUrl);
        });
    </script>
</body>
</html>
