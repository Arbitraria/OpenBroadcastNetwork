<!DOCTYPE html>
<html>
<head>
    <title>Firefox MediaSource Test</title>
</head>
<body>
    <h1>Firefox MediaSource Compatibility Test</h1>
    <video id="video" controls width="640" height="480"></video>
    <div id="log"></div>

    <script>
        const video = document.getElementById('video');
        const log = document.getElementById('log');

        function addLog(message) {
            console.log(message);
            log.innerHTML += '<p>' + new Date().toLocaleTimeString() + ': ' + message + '</p>';
        }

        addLog('🦊 Firefox MediaSource Test Started');

        // Check MediaSource support
        if (!window.MediaSource) {
            addLog('❌ MediaSource API not supported');
        } else {
            addLog('✅ MediaSource API supported');
        }

        // Check codec support
        const videoCodec = 'video/mp4; codecs="avc1.42E01E"';
        const audioCodec = 'audio/mp4; codecs="mp4a.40.2"';

        if (MediaSource.isTypeSupported) {
            const videoSupported = MediaSource.isTypeSupported(videoCodec);
            const audioSupported = MediaSource.isTypeSupported(audioCodec);
            
            addLog('🎬 Video codec (' + videoCodec + '): ' + (videoSupported ? '✅ Supported' : '❌ Not supported'));
            addLog('🎵 Audio codec (' + audioCodec + '): ' + (audioSupported ? '✅ Supported' : '❌ Not supported'));

            // Test alternative codec strings for Firefox
            const altVideoCodec = 'video/mp4; codecs="avc1.42001e"';
            const altAudioCodec = 'audio/mp4; codecs="mp4a.40.02"';
            
            addLog('🎬 Alt video codec (' + altVideoCodec + '): ' + (MediaSource.isTypeSupported(altVideoCodec) ? '✅ Supported' : '❌ Not supported'));
            addLog('🎵 Alt audio codec (' + altAudioCodec + '): ' + (MediaSource.isTypeSupported(altAudioCodec) ? '✅ Supported' : '❌ Not supported'));
        }

        // Test WebSocket connection
        addLog('🔌 Testing WebSocket connection...');
        const ws = new WebSocket('ws://127.0.0.1:8080/stream');
        
        ws.onopen = function() {
            addLog('✅ WebSocket connected');
        };
        
        ws.onmessage = function(event) {
            if (typeof event.data === 'string') {
                try {
                    const data = JSON.parse(event.data);
                    addLog('📨 Received: ' + data.type);
                } catch (e) {
                    addLog('📨 Received text: ' + event.data.substring(0, 100));
                }
            } else {
                addLog('📦 Received binary: ' + event.data.size + ' bytes');
            }
        };
        
        ws.onerror = function(error) {
            addLog('❌ WebSocket error: ' + error);
        };
        
        ws.onclose = function() {
            addLog('🔌 WebSocket closed');
        };

        // Test basic video element
        video.onerror = function(e) {
            addLog('❌ Video error: ' + e.message);
        };

        addLog('📋 Test complete - check results above');
    </script>
</body>
</html>
