[package]
name = "OpenBroadcastNetwork-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "fs"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = "1.0"
serde_with = { version = "3.0", features = ["macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = "1.0"
anyhow = { version = "1.0", features = ["backtrace"] }
# Using libp2p with tokio runtime
libp2p = { version = "0.53.0", features = ["tokio", "tcp", "dns", "gossipsub", "identify", "kad", "noise", "yamux"] }
async-trait = "0.1"
futures = { version = "0.3", features = ["compat"] }
rand = "0.8"
bs58 = "0.4"
bytes = "1.4"
# Use blake3 for message hashing instead of sha2 to avoid dependency conflicts
blake3 = "1.5.0"
hex = "0.4.3"
lru = "0.10"
webrtc = { workspace = true }
geo-ip = "0.1.0"
log = "0.4"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
url = "2.3"
humantime-serde = "1.1.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
getrandom = "0.2"
sha2 = "0.10"
# FFmpeg bindings for video/audio encoding
ffmpeg-next = "7.1"

[dev-dependencies]
tokio-test = "0.4"
tokio = { workspace = true, features = ["macros", "test-util", "rt-multi-thread"] }
