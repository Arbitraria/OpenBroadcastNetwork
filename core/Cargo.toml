[package]
name = "OpenBroadcastNetwork-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native = [
    "dep:tokio",
    "dep:libp2p",
    "dep:openh264",
    "dep:opus",
    "dep:geo-ip",
    "dep:mp4parse",
    "dep:reqwest",
    "dep:tracing-subscriber",
    "dep:humantime-serde",
    "dep:log",
    "dep:byteorder",
]
wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:gloo-timers",
    "dep:instant",
    "getrandom/js",
]
native-webrtc = ["webrtc"]
ffmpeg = ["ffmpeg-next"]
experimental-overlay = []

[dependencies]
# ── Platform-independent deps (always included) ──
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = "1.0"
tracing = { workspace = true }
thiserror = "1.0"
anyhow = { version = "1.0", features = ["backtrace"] }
async-trait = "0.1"
futures = { version = "0.3", features = ["compat"] }
rand = "0.8"
bs58 = "0.4"
bytes = { version = "1.4", features = ["serde"] }
serde_bytes = "0.11"
bincode = "1.3"
blake3 = "1.5.0"
hex = "0.4.3"
lru = "0.10"
sha2 = "0.10"
getrandom = "0.2"

# ── Native-only deps (optional, activated by "native" feature) ──
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "fs"], optional = true }
libp2p = { version = "0.53.0", features = [
  "tokio", "tcp", "dns", "gossipsub", "identify", "kad", "noise", "yamux",
  "relay", "autonat", "dcutr", "macros"
], optional = true }
openh264 = { version = "0.4", optional = true }
opus = { version = "0.3", optional = true }
geo-ip = { version = "0.1.0", optional = true }
mp4parse = { version = "0.17", optional = true }
reqwest = { version = "0.11", features = ["json"], optional = true }
tracing-subscriber = { workspace = true, optional = true }
humantime-serde = { version = "1.1.1", optional = true }
log = { version = "0.4", optional = true }
byteorder = { version = "1.4", optional = true }
webrtc = { workspace = true, optional = true }
ffmpeg-next = { version = "7.0", optional = true }

# ── WASM-only deps (optional, activated by "wasm" feature) ──
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = [
    "console", "WebSocket", "MessageEvent", "BinaryType",
    "ErrorEvent", "CloseEvent",
], optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
instant = { version = "0.1", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tokio = { workspace = true, features = ["macros", "test-util", "rt-multi-thread"] }
