[workspace]
members = [
  "core",
  "node",
  "ui",
  "proto"
]
resolver = "2"


[workspace.dependencies]
tokio = { version = "1.28", features = ["full"] }
# Explicitly specify subtle version to resolve conflicts
subtle = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
# Using version 0.53.0 of libp2p to ensure compatibility
libp2p = { version = "0.53.0", features = ["tokio", "tcp", "dns", "gossipsub", "identify", "kad", "noise"] }
webrtc = "0.7"
axum = "0.6"