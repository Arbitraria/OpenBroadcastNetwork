[workspace]
members = [
  "core",
  "node",
  "ui",
  "proto"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.28", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
libp2p = { version = "0.55.0", features = ["async-std", "tcp", "dns", "mdns", "gossipsub", "identify", "kad", "noise"] }
webrtc = "0.7"
axum = "0.6" 