[pytest]
# Default test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode
asyncio_mode = auto

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    browser: marks tests that require browser automation
    network: marks tests that require multiple nodes
    webrtc: marks tests that require WebRTC support

# Default options
addopts =
    --tb=short
    -ra
    --strict-markers

# Timeout for individual tests (in seconds)
timeout = 60

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
