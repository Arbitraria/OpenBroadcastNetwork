[package]
name = "OpenBroadcastNetwork-ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
OpenBroadcastNetwork-core = { path = "../core", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console", "Window", "Document", "HtmlMediaElement",
    "MediaSource", "SourceBuffer", "SourceBufferList",
    "Url",
] }
serde = { workspace = true }
serde_json = "1.0"
serde-wasm-bindgen = "0.5"
futures = "0.3"
tracing = "0.1"
