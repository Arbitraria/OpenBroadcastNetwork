<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBroadcastNetwork Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #video-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            transition: opacity 0.3s;
        }

        #controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background: rgba(0,0,0,0.7);
            border-radius: 5px;
            font-size: 14px;
        }

        #status.connected {
            border-left: 3px solid #4CAF50;
        }

        #status.connecting {
            border-left: 3px solid #FF9800;
        }

        #status.error {
            border-left: 3px solid #F44336;
        }

        #debug-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            max-height: 50vh;
            background: rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-y: auto;
            display: none;
        }

        #debug-panel.visible {
            display: block;
        }

        #debug-panel h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }

        #debug-panel .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        #debug-panel .stat-value {
            font-weight: bold;
            color: #4CAF50;
        }

        .control-button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 8px 16px;
            margin: 0 5px;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .control-button:hover {
            background: rgba(255,255,255,0.2);
        }

        .control-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }

        #loading-spinner.visible {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 20px;
            background: rgba(244, 67, 54, 0.9);
            border-radius: 5px;
            display: none;
        }

        #error-message.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="video-container">
            <video id="video" controls></video>
            
            <div id="loading-spinner">
                <div class="spinner"></div>
            </div>
            
            <div id="error-message">
                <h3>Connection Error</h3>
                <p id="error-text"></p>
                <button class="control-button" id="retry-button">Retry</button>
            </div>
            
            <div id="status" class="connecting">
                <span id="status-text">Connecting...</span>
            </div>
            
            <div id="controls">
                <button class="control-button" id="play-button">Play</button>
                <button class="control-button" id="pause-button">Pause</button>
                <button class="control-button" id="debug-toggle">Debug</button>
            </div>
            
            <div id="debug-panel">
                <h3>Stream Statistics</h3>
                <div class="stat">
                    <span>Connection:</span>
                    <span class="stat-value" id="debug-connection">-</span>
                </div>
                <div class="stat">
                    <span>Video Codec:</span>
                    <span class="stat-value" id="debug-video-codec">-</span>
                </div>
                <div class="stat">
                    <span>Audio Codec:</span>
                    <span class="stat-value" id="debug-audio-codec">-</span>
                </div>
                <div class="stat">
                    <span>Buffered:</span>
                    <span class="stat-value" id="debug-buffered">-</span>
                </div>
                <div class="stat">
                    <span>Chunks Received:</span>
                    <span class="stat-value" id="debug-chunks">-</span>
                </div>
                <div class="stat">
                    <span>Bytes Received:</span>
                    <span class="stat-value" id="debug-bytes">-</span>
                </div>
                <div class="stat">
                    <span>Dropped Frames:</span>
                    <span class="stat-value" id="debug-dropped">-</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
