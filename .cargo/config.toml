# sccache is intentionally NOT forced here: a committed `rustc-wrapper` breaks every
# environment that doesn't have sccache installed (CI runners, fresh clones, Docker).
# To use sccache locally, opt in via your own environment instead, e.g.:
#   export RUSTC_WRAPPER=sccache
# (in your shell rc, or a local untracked .cargo/config.toml).

[target.wasm32-unknown-unknown]
# WASM-specific settings
rustflags = [
  "-C", "link-arg=--no-entry",
  "-C", "link-arg=--export-table",
  "-C", "link-arg=--max-memory=4294967296",
]

[target.'cfg(all())']
rustflags = [
  # Enables better optimizations
  "-C", "target-cpu=native",
  # Enables additional warnings
  "-W", "missing_docs",
]

[alias]
check-all = "check --workspace --all-targets --all-features"
clippy-all = "clippy --workspace --all-targets --all-features -- -D warnings" 